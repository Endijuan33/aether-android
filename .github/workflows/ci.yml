# Project AETHER — continuous integration.
#
# Builds, tests, lints, format-checks, and assembles the debug APK on every
# push and pull request targeting main. Every third-party action is pinned to
# a full immutable commit SHA (the release version is kept as a trailing
# comment for readability). Least privilege: this workflow only reads the
# repository and never writes to it, so no `write` permission is granted.
# The APK in the `debug-apk` artifact is genuinely built by the
# `assembleDebug` step below — never claimed, always produced.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs of this workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, test, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check Kotlin formatting
        run: ./gradlew ktfmtCheck --console=plain

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Test release-summary safety
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run Android lint
        run: ./gradlew lintDebug lintRelease --console=plain

      - name: Check resolved runtime dependencies
        run: |
          ./gradlew :app:exportRuntimeDependencies --console=plain
          python3 scripts/check_dependency_advisories.py

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Assemble unsigned release and compile device tests
        run: ./gradlew assembleRelease assembleDebugAndroidTest --console=plain

      - name: APK checksums and build summary
        run: |
          set -euo pipefail
          python3 scripts/inspect_apks.py app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > app/build/reports/apk-inspection.json
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > checksums.txt
          {
            echo '## Validation'
            echo 'Formatting, unit tests, both lint variants and APK assembly passed.'
            echo 'Device tests were compiled. Hardware validation still pending.'
            echo 'Release APK is unsigned and requires release signing.'
            echo '```'
            cat checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned release and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            checksums.txt
            app/build/reports/apk-inspection.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          retention-days: 14
          if-no-files-found: warn

  instrumentation:
    name: Android UI and platform regressions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android UI and platform tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # immutable v2 revision
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console=plain
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          retention-days: 14
          if-no-files-found: warn
