# Project AETHER — release pipeline.
#
# Triggered by version tags (v*) or manually via workflow_dispatch. Runs the
# full verification suite, builds the release APK, optionally signs it with
# apksigner when the signing secrets are configured, then publishes SHA-256
# checksums and a summary. Nothing is pushed to GitHub; artifacts carry the
# release. Every third-party action is pinned to a full immutable commit SHA
# (release version kept as a trailing comment).
#
# Signing is deliberately a workflow step, not a build signingConfig: the app
# build defines no signingConfig, so the assembled release APK is unsigned.
# The APK is signed in this workflow ONLY when all four secrets are present:
#   AETHER_KEYSTORE_BASE64, AETHER_KEYSTORE_PASSWORD,
#   AETHER_KEY_ALIAS, AETHER_KEY_PASSWORD
# If any secret is missing, signing is skipped and the summary honestly says
# the release is unsigned. Keystores and passwords are never committed and
# never printed; passwords reach apksigner via environment indirection only.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Releases publish no GitHub objects (artifacts only), so cancelling a
# superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (unit tests + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run unit tests and lint
        run: ./gradlew ktfmtCheck testDebugUnitTest lintDebug lintRelease assembleDebugAndroidTest --console=plain

      - name: Test release-summary safety
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check resolved runtime advisories
        run: |
          ./gradlew :app:exportRuntimeDependencies --console=plain
          python3 scripts/check_dependency_advisories.py

  build:
    name: Build release APK (+ optional signing)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.sign_apk.outcome == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Detect signing secrets
        id: signing
        env:
          AETHER_KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Only test for presence; secret values are never printed or logged.
          if [[ -n "${AETHER_KEYSTORE_BASE64:-}" && -n "${AETHER_KEYSTORE_PASSWORD:-}" \
             && -n "${AETHER_KEY_ALIAS:-}" && -n "${AETHER_KEY_PASSWORD:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "All four signing secrets present — APK will be signed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets incomplete — APK will remain unsigned."
          fi

      - name: Sign APK with apksigner
        id: sign_apk
        if: steps.signing.outputs.enabled == 'true'
        env:
          AETHER_KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/aether-release.keystore" "$RUNNER_TEMP/aether-signed.apk"' EXIT
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          echo "Signing $APK ..."
          printf '%s' "$AETHER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aether-release.keystore"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          # Sign to a temp file, verify, then replace the unsigned APK so the
          # artifact below contains exactly one APK: the signed one.
          # Passwords are passed via env indirection, never on the command line.
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/aether-release.keystore" \
            --ks-pass "env:AETHER_KEYSTORE_PASSWORD" \
            --ks-key-alias "$AETHER_KEY_ALIAS" \
            --key-pass "env:AETHER_KEY_PASSWORD" \
            --out "$RUNNER_TEMP/aether-signed.apk" "$APK"
          "$APKSIGNER" verify "$RUNNER_TEMP/aether-signed.apk"
          mv "$RUNNER_TEMP/aether-signed.apk" "$APK"
          rm -f "$RUNNER_TEMP/aether-release.keystore"
          echo "apksigner verify: OK"

      - name: Note unsigned release
        if: steps.signing.outputs.enabled != 'true'
        run: |
          {
            echo "## Signing"
            echo "Unsigned release — signing secrets not configured."
            echo "To produce signed releases, configure all four repository secrets:"
            echo "AETHER_KEYSTORE_BASE64, AETHER_KEYSTORE_PASSWORD, AETHER_KEY_ALIAS, AETHER_KEY_PASSWORD."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect final APK and native alignment
        run: python3 scripts/inspect_apks.py app/build/outputs/apk/release/*.apk > app/build/reports/apk-inspection.json

      - name: Upload final APK inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk-inspection
          path: app/build/reports/apk-inspection.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

  checksums:
    name: Compute SHA-256 checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist

      - name: Compute SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.apk > checksums.txt
          cat checksums.txt
          {
            echo "## Checksums"
            echo '```'
            cat checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt
          retention-days: 14

  summary:
    name: Release summary
    needs: [verify, build, checksums]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # continue-on-error here: the summary must render even when an upstream
      # job failed and its artifacts do not exist; missing data is reported
      # as n/a rather than failing the report itself.
      - name: Download release APK
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist-apk

      - name: Download checksums
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: dist-sums

      - name: Write release summary
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERIFY_RESULT: ${{ needs.verify.result }}
          RELEASE_BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_SIGNED: ${{ needs.build.outputs.signed }}
        run: bash scripts/release_summary.sh
